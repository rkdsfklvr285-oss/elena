<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>E.L.E.N.A.</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:#f5f6f8;color:#202124}
.app{max-width:520px;margin:auto;min-height:100vh;background:#fff;display:flex;flex-direction:column}
header{padding:22px 20px 14px;border-bottom:1px solid #eee;display:flex;align-items:center;gap:12px;position:sticky;top:0;background:#fff;z-index:2}
.logo{width:46px;height:46px;border-radius:14px;background:#202124;color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px;letter-spacing:1px}
h1{font-size:21px;margin:0}.sub{font-size:12px;color:#777;margin-top:3px}
main{padding:16px 16px 105px;flex:1}
.card{border:1px solid #e8e8e8;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px #00000008}
.greeting{font-size:15px;line-height:1.65}.greeting b{font-size:17px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#f7f7f8;border-radius:14px;padding:14px}.label{font-size:12px;color:#777}.value{font-size:25px;font-weight:700;margin-top:5px}
.section-title{font-size:14px;font-weight:700;margin-bottom:10px}
.menu-item{display:flex;gap:10px;align-items:center;padding:11px 0;border-top:1px solid #eee}.dot{width:8px;height:8px;border-radius:50%;background:#202124}.menu-item span{font-size:14px}
.chat{height:270px;overflow:auto;padding:4px}.msg{max-width:85%;padding:10px 13px;border-radius:15px;margin:8px 0;font-size:14px;line-height:1.55;white-space:pre-wrap}.ai{background:#f1f2f4}.me{background:#202124;color:#fff;margin-left:auto}
.chat-input{display:flex;gap:8px;margin-top:10px}.chat-input input{flex:1;border:1px solid #ddd;border-radius:13px;padding:12px;font-size:14px;outline:none}.btn{border:0;border-radius:13px;background:#202124;color:#fff;padding:0 15px;font-weight:700}
.controls{display:flex;gap:10px}.bigbtn{flex:1;border:0;border-radius:15px;padding:14px;font-size:15px;font-weight:700}.start{background:#202124;color:#fff}.stop{background:#eee;color:#222}
.timer{text-align:center;font-size:40px;font-variant-numeric:tabular-nums;font-weight:700;margin:7px 0 13px}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:#ffffffef;backdrop-filter:blur(10px);border-top:1px solid #eee}
.voice{width:100%;padding:14px;border:0;border-radius:15px;background:#f0f1f3;font-weight:700;font-size:14px}
.voice.listening{background:#202124;color:#fff}
.note{font-size:11px;color:#888;line-height:1.5;margin-top:8px}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="logo">E.L.</div>
  <div><h1>E.L.E.N.A.</h1><div class="sub">Your personal study companion</div></div>
</header>

<main>
  <div class="card greeting">
    <b id="greeting">お、来ましたね。</b><br>
    今日も一緒にやりますか？ 私はいつでも付き合いますよ。
  </div>

  <div class="card">
    <div class="section-title">今日の記録</div>
    <div class="stats">
      <div class="stat"><div class="label">勉強時間</div><div class="value" id="total">0分</div></div>
      <div class="stat"><div class="label">セッション</div><div class="value" id="sessions">0回</div></div>
    </div>
  </div>

  <div class="card">
    <div class="section-title">今日の勉強メニュー</div>
    <div class="menu-item"><div class="dot"></div><span>物理：力学を30〜45分</span></div>
    <div class="menu-item"><div class="dot"></div><span>数学：苦手分野を1テーマ</span></div>
    <div class="menu-item"><div class="dot"></div><span>英語：英文を30分</span></div>
  </div>

  <div class="card">
    <div class="section-title">勉強タイマー</div>
    <div class="timer" id="timer">00:00:00</div>
    <div class="controls">
      <button class="bigbtn start" onclick="startStudy()">勉強開始</button>
      <button class="bigbtn stop" onclick="stopStudy()">勉強終了</button>
    </div>
    <div class="note">開始すると時間を測ります。終了すると今日の記録に追加します。</div>
  </div>

  <div class="card">
    <div class="section-title">E.L.E.N.A.に相談</div>
    <div class="chat" id="chat"></div>
    <div class="chat-input">
      <input id="input" placeholder="「今日何やればいい？」など">
      <button class="btn" onclick="send()">送信</button>
    </div>
  </div>
</main>

<div class="bottom">
  <button class="voice" id="voiceBtn" onclick="voiceInput()">🎙️ 声でE.L.E.N.A.と話す</button>
</div>
</div>

<script>
let startTime=null, interval=null, todaySeconds=Number(localStorage.getItem("elenaSeconds")||0);
let sessions=Number(localStorage.getItem("elenaSessions")||0);
const $=id=>document.getElementById(id);

function pad(n){return String(n).padStart(2,"0")}
function renderStats(){
  $("total").textContent=Math.floor(todaySeconds/60)+"分";
  $("sessions").textContent=sessions+"回";
}
function updateTimer(){
  const s=startTime?Math.floor((Date.now()-startTime)/1000):0;
  $("timer").textContent=`${pad(Math.floor(s/3600))}:${pad(Math.floor(s%3600/60))}:${pad(s%60)}`;
}
function startStudy(){
  if(startTime)return;
  startTime=Date.now(); interval=setInterval(updateTimer,500);
  $("greeting").textContent="よし、始めましょうか。";
  say("よし、始めましょうか。まずは目の前の一問から。");
}
function stopStudy(){
  if(!startTime){say("まだ勉強を開始してませんよ。笑");return}
  const elapsed=Math.floor((Date.now()-startTime)/1000);
  todaySeconds+=elapsed;sessions++;
  localStorage.setItem("elenaSeconds",todaySeconds);localStorage.setItem("elenaSessions",sessions);
  clearInterval(interval);interval=null;startTime=null;updateTimer();renderStats();
  say(`お疲れさまです。今日は合計${Math.floor(todaySeconds/60)}分。ちゃんと積み上がってますよ。`);
}
function addMsg(text,who){
  const d=document.createElement("div");d.className="msg "+who;d.textContent=text;
  $("chat").appendChild(d);$("chat").scrollTop=$("chat").scrollHeight;
}
function say(text){addMsg(text,"ai")}
function respond(t){
  t=t.toLowerCase();
  if(t.includes("何や")||t.includes("メニュー")||t.includes("勉強")){
    return "今日はまず物理を30〜45分。そのあと数学を1テーマ。最後に英語を30分くらいでいきましょう。\n……数学、後回しにするのはナシですよ？笑";
  }
  if(t.includes("疲れ")||t.includes("しんど")){
    return "お疲れですね。無理して何時間もやる必要はないです。\nでも完全にゼロにはしない。まず20〜30分だけやって、そこで判断しましょう。";
  }
  if(t.includes("やる気")||t.includes("めんど")){
    return "やる気が出るまで待つと、たぶん来ません。笑\nなので先に5分だけ始めましょう。始めたら意外と続きます。";
  }
  if(t.includes("物理")){
    return "物理ですね。分からない問題があるなら、その問題を見せてください。式の意味から一緒に整理しましょう。";
  }
  if(t.includes("数学")){
    return "数学ですか。了解。苦手から逃げると後で追いかけてきますよ。笑\n今日は1テーマだけ、しっかり潰しましょう。";
  }
  if(t.includes("休憩")){
    return "いいですよ。10〜15分くらい休みましょう。スマホを触り始めると戻ってこなくなるので、そこだけ注意です。";
  }
  if(t.includes("ありがとう")){
    return "どういたしまして。こっちはいつでもいますよ。次は何やります？";
  }
  return "了解です。もう少し詳しく話してみてください。勉強のことなら、遠慮なく相談してください。";
}
function send(){
  const input=$("input"), text=input.value.trim();if(!text)return;
  addMsg(text,"me");input.value="";
  setTimeout(()=>say(respond(text)),250);
}
$("input").addEventListener("keydown",e=>{if(e.key==="Enter")send()});

let recognition=null;
function voiceInput(){
  const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SpeechRecognition){
    say("このブラウザでは音声入力に対応してないみたいです。iPhoneならSafariで試してみてください。");
    return;
  }
  if(recognition){recognition.stop();return}
  recognition=new SpeechRecognition();recognition.lang="ja-JP";recognition.interimResults=false;
  $("voiceBtn").classList.add("listening");$("voiceBtn").textContent="🔴 聞いてます…";
  recognition.onresult=e=>{
    const text=e.results[0][0].transcript;addMsg(text,"me");
    const reply=respond(text);setTimeout(()=>{say(reply);speak(reply)},200);
  };
  recognition.onerror=()=>say("うまく聞き取れませんでした。もう一度どうぞ。");
  recognition.onend=()=>{$("voiceBtn").classList.remove("listening");$("voiceBtn").textContent="🎙️ 声でE.L.E.N.A.と話す";recognition=null};
  recognition.start();
}
function speak(text){
  if(!("speechSynthesis" in window))return;
  speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="ja-JP";u.rate=1.03;speechSynthesis.speak(u);
}
renderStats();
say("お、来ましたね。今日は何からいきます？");
</script>
</body>
</html>
